[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
